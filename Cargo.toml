[package]
name = "audiobook-stitcher"
version = "0.1.0"
description = "Merge a folder of chapter audio files into a chaptered .m4b audiobook"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"

[lib]
name = "audiobook_stitcher"
path = "src/lib.rs"

[[bin]]
name = "audiobook-stitcher"
path = "src/main.rs"

[dependencies]
# gpui-component 0.5.x is the last line that builds against the crates.io
# `gpui` release (0.2.x). 0.6+/0.7 moved to the gpui-kit forks (gpui-pre).
gpui = "=0.2.2"
gpui-component = "=0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.11.0", features = ["macros"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "process", "io-util"] }
futures = "0.3"
thiserror = "1.0"
tempfile = "3"
regex = "1"
once_cell = "1.20"
which = "6"
num_cpus = "1.16"
shellexpand = "3"
async-channel = "2"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

[package.metadata.bundle]
name = "Audiobook Stitcher"
identifier = "com.novogenia.audiobook-stitcher"
icon = ["assets/icon.icns", "assets/icon.png"]
resources = ["resources/bin"]
category = "public.app-category.music"
short_description = "Merge chapter audio files into a chaptered .m4b"
